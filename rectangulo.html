<center><h3>Informacion acerca del triangulo</h3>
<p><font face="arial">Un triángulo rectángulo es un triángulo que tiene un ángulo recto, es decir, un ángulo de 90 grados. Los dos lados que forman el ángulo recto se llaman catetos, y el lado opuesto al ángulo recto se llama hipotenusa, que es el lado más largo del triángulo. </font></center>
